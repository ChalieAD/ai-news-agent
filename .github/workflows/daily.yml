name: Jarvis AI Briefing — Daily

on:
  schedule:
    - cron: "0 6 * * *"   # 6am UTC daily — runs before Candle Intel (7am)
  workflow_dispatch:       # allow manual trigger from GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI News Agent pipeline
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          EMAIL_ADDRESS:      ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL:           ${{ secrets.TO_EMAIL }}
          PRODUCTHUNT_TOKEN:  ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: python run.py

      - name: Upload reports as artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: reports/
          retention-days: 30
